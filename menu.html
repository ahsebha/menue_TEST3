<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المنيو | Café Luna</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <a href="index.html" class="logo">

            <div class="logo-icon">☕</div>

            <div>
                <h1>Café Luna</h1>
                <span>COFFEE & DESSERTS</span>
            </div>

        </a>


        <nav class="nav">

            <a href="index.html">
                الرئيسية
            </a>

            <a href="menu.html" class="active">
                المنيو
            </a>

        </nav>


        <button class="cart-button" onclick="openCart()">

            🛍️

            <span>
                السلة
            </span>

            <b id="cart-count">
                0
            </b>

        </button>

    </header>


    <!-- Menu Hero -->
    <section class="menu-page-hero">

        <div class="container">

            <span>
                ✦ CAFÉ LUNA
            </span>

            <h1>
                منيو كافيه لونا
            </h1>

            <p>
                اختار اللي بتحبه وخلي الباقي علينا ☕
            </p>

        </div>

    </section>


    <!-- Menu -->
    <main class="menu-main">

        <div class="container">

            <!-- Heading -->
            <div class="section-heading">

                <div>

                    <span class="section-label">
                        OUR MENU
                    </span>

                    <h2>
                        اختار طلبك
                    </h2>

                </div>

            </div>


            <!-- Search -->
            <div class="search-box">

                <span>🔎</span>

                <input
                    type="text"
                    id="search-input"
                    placeholder="ابحث عن مشروب أو حلى..."
                    oninput="searchProducts()"
                >

            </div>


            <!-- Categories -->
            <div class="categories">

                <button
                    class="category-button active"
                    onclick="filterProducts('all', this)">
                    الكل
                </button>

                <button
                    class="category-button"
                    onclick="filterProducts('hot', this)">
                    ☕ قهوة ساخنة
                </button>

                <button
                    class="category-button"
                    onclick="filterProducts('cold', this)">
                    🧊 قهوة باردة
                </button>

                <button
                    class="category-button"
                    onclick="filterProducts('dessert', this)">
                    🍰 حلويات
                </button>

                <button
                    class="category-button"
                    onclick="filterProducts('drinks', this)">
                    🥤 مشروبات
                </button>

            </div>


            <!-- Products -->
            <div
                class="products"
                id="products">
            </div>

        </div>

    </main>


    <!-- Cart Overlay -->
    <div
        class="cart-overlay"
        id="cart-overlay"
        onclick="closeCart(event)">

        <div
            class="cart"
            onclick="event.stopPropagation()">

            <div class="cart-header">

                <div>
                    <span>YOUR ORDER</span>
                    <h2>سلة الطلب</h2>
                </div>

                <button onclick="closeCart()">
                    ✕
                </button>

            </div>


            <div
                class="cart-items"
                id="cart-items">
            </div>


            <div class="cart-footer">
                <div class="order-info">

    <h3>معلومات الطلب</h3>

    <div class="order-type">

        <label class="order-option active">
            <input
                type="radio"
                name="order-type"
                value="table"
                checked
                onchange="changeOrderType()"
            >

            <span>
                🪑 أنا داخل الكافيه
            </span>
        </label>


        <label class="order-option">
            <input
                type="radio"
                name="order-type"
                value="phone"
                onchange="changeOrderType()"
            >

            <span>
                📦 أنا خارج الكافيه
            </span>
        </label>

    </div>


    <!-- Table -->
    <div
        class="order-field"
        id="table-field">

        <label for="table-number">
            رقم الطاولة
        </label>

        <input
            type="number"
            id="table-number"
            placeholder="مثال: 12"
            min="1"
        >

    </div>


    <!-- Phone -->
    <div
        class="order-field"
        id="phone-field"
        style="display: none;">

        <label for="customer-phone">
            رقم الهاتف
        </label>

        <input
            type="tel"
            id="customer-phone"
            placeholder="07XXXXXXXX"
        >

    </div>

</div>

                <div class="cart-total-row">

                    <span>
                        المجموع
                    </span>

                    <strong>
                        <span id="cart-total">0.00</span> JD
                    </strong>

                </div>


                <button
                    class="checkout-button"
                    onclick="checkout()">

                    إتمام الطلب عبر واتساب
                    <span>→</span>

                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
